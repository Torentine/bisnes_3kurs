[project]
name = "company-capitalization"
version = "0.1.0"
description = "Reproducible Market Cap regression for S&P 500 companies: train/predict CLI with leakage-safe pipelines."
readme = "README.md"
authors = [{ name = "AAI_25_Case84Report team" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.6,<2",
    "joblib>=1.4,<2",
]

[project.optional-dependencies]
boosting = [
    "xgboost>=2.1,<4",
    "lightgbm>=4.5,<5",
    "catboost>=1.2.8,<2",
]
tuning = ["optuna>=4.0,<6"]

[project.scripts]
capitalization = "company_capitalization.cli:main"

[tool.poetry]
packages = [{ include = "company_capitalization", from = "src" }]

[tool.poetry.group.dev.dependencies]
ruff = "0.16.10"
mypy = "^2.4"
pytest = "^9.1"
pytest-cov = "^7.0"
pre-commit = "^4.6"
pandas-stubs = ">=2.2"

[tool.poetry.group.notebook]
optional = true

[tool.poetry.group.notebook.dependencies]
ipykernel = "^7.0"
nbconvert = "^7.16"

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Archived research notebooks are kept as-is and are not reformatted.
extend-exclude = ["Stages_Notebooks", "*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "N",   # pep8-naming
    "C4",  # comprehensions
    "PTH", # pathlib instead of os.path
    "NPY", # numpy-specific rules
    "PD",  # pandas-vet
    "RUF", # ruff-specific
    "D",   # pydocstyle (public API docstrings)
]
ignore = [
    "D105", # magic methods
    "D107", # __init__ documented on the class
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PD901"]

[tool.ruff.lint.pep8-naming]
# scikit-learn estimator API names the feature matrix `X`.
extend-ignore-names = ["X"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src/company_capitalization"]
strict = true
warn_unreachable = true
pretty = true

# Third-party ML libraries ship without type information.
[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "joblib.*",
    "xgboost.*",
    "lightgbm.*",
    "catboost.*",
    "optuna.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::FutureWarning:company_capitalization.*"]
