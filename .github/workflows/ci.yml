name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: python -m pip install "poetry==2.5.1"

      - name: Validate lock file
        run: poetry check --lock

      - name: Install from lock file (dev group + all extras)
        run: poetry install --with dev --all-extras --no-interaction

      - name: Ruff lint
        run: poetry run ruff check src tests

      - name: Ruff format check
        run: poetry run ruff format --check src tests

      - name: mypy
        run: poetry run mypy src/company_capitalization

      - name: Tests
        run: poetry run pytest

      - name: Pre-commit hooks
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: poetry run pre-commit run --all-files --show-diff-on-failure

      - name: Smoke train/predict (baseline)
        shell: bash
        run: |
          poetry run capitalization --log-level WARNING train --data financials_src.csv \
            --model ridge --seed 42 --test-size 0.2 --cv-folds 5 --output-dir artifacts/ridge
          poetry run capitalization predict --model artifacts/ridge \
            --data examples/companies_without_target.csv \
            --output artifacts/predictions/ridge_predictions.csv

      - name: Build package
        run: poetry build
